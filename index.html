<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>EVERPENDRA</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091008;font-family:Arial;color:#fff}canvas{width:100%;height:100%;display:block}#hud{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;font-weight:700;text-shadow:0 2px 5px #000}.pill{background:#0008;border:1px solid #fff3;border-radius:999px;padding:9px 13px;font-size:13px}#intro{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#203a25aa,#050705ee);z-index:5}.panel{text-align:center;padding:28px;max-width:520px}.logo{font-size:clamp(48px,12vw,90px);font-weight:900;letter-spacing:-.07em;margin:0}.sub{letter-spacing:.22em;color:#d9b56a;font-size:12px;text-transform:uppercase}button{border:0;border-radius:999px;padding:14px 25px;font-weight:800;background:#d9b56a;color:#16120a;font-size:15px}#controls{position:fixed;left:0;right:0;bottom:18px;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.pad{display:flex;gap:10px;pointer-events:auto}.ctrl{width:58px;height:58px;border-radius:50%;border:1px solid #fff4;background:#0008;color:white;font-size:22px}#hint{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);font-size:11px;color:#ffffffaa;text-align:center;white-space:nowrap}</style></head><body>
<canvas id="game"></canvas><div id="hud"><div class="pill">❤️ <span id="hp">3</span></div><div class="pill">🪙 <span id="coins">0</span> · <span id="distance">0</span>m</div></div>
<div id="intro"><div class="panel"><div class="sub">AN ENDLESS INDIAN ADVENTURE</div><h1 class="logo">EVERPENDRA</h1><p>Explore ancient forests, forgotten ruins and mysterious Indian-inspired realms.</p><button id="start">START ADVENTURE</button></div></div>
<div id="hint">Tap the screen or ↑ to jump · collect coins · avoid obstacles</div><div id="controls"><div class="pad"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><div class="pad"><button class="ctrl" id="jump">↑</button></div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
let running=false,p={x:0,y:0,vy:0,ground:true},world=0,speed=4,coins=0,hp=3,obs=[],spawn=0;
function reset(){p={x:W*.25,y:H*.72,vy:0,ground:true};world=0;speed=4;coins=0;hp=3;obs=[];spawn=0}
function jump(){if(running&&p.ground){p.vy=-12;p.ground=false}}
function start(){reset();running=true;document.getElementById('intro').style.display='none'}
document.getElementById('start').onclick=start;document.getElementById('jump').onclick=jump;addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key===' ')jump()});
c.addEventListener('pointerdown',e=>{if(running&&e.target===c)jump()});
function add(){let x=W+80+Math.random()*180;if(Math.random()<.58)obs.push({t:0,x,y:H*.77,w:30+Math.random()*20,h:35+Math.random()*25});else obs.push({t:1,x,y:H*.62-Math.random()*80,r:10});if(Math.random()<.35)obs.push({t:1,x:x+80,y:H*.6-Math.random()*100,r:10})}
function draw(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#173a43');g.addColorStop(.5,'#d4874f');g.addColorStop(1,'#e6b66b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);let ground=H*.77;ctx.fillStyle='#1b351e';ctx.fillRect(0,ground,W,H-ground);
for(let i=0;i<8;i++){let x=((i*180-world*.18)%(W+220)+W+220)%(W+220)-100;ctx.fillStyle='#12301a';ctx.beginPath();ctx.moveTo(x,ground);ctx.lineTo(x+45,ground-150);ctx.lineTo(x+90,ground);ctx.fill()}
let tx=((W*.7-world*.12)%(W+300)+W+300)%(W+300)-150;ctx.fillStyle='#7a4930';ctx.fillRect(tx,ground-70,90,50);ctx.beginPath();ctx.moveTo(tx-8,ground-70);ctx.lineTo(tx+45,ground-115);ctx.lineTo(tx+98,ground-70);ctx.fill();ctx.fillStyle='#d6a05b';ctx.fillRect(tx+37,ground-52,17,32);
obs.forEach(o=>{let x=o.x-world;if(o.t===0){ctx.fillStyle='#4c4b43';ctx.beginPath();ctx.moveTo(x,o.y);ctx.lineTo(x+o.w*.4,o.y-o.h);ctx.lineTo(x+o.w,o.y);ctx.fill()}else{ctx.fillStyle='#e7b74d';ctx.beginPath();ctx.arc(x,o.y,o.r,0,Math.PI*2);ctx.fill()}});
ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='#b97943';ctx.beginPath();ctx.arc(17,-10,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d9b56a';ctx.fillRect(2,4,30,37);ctx.fillStyle='#2d4c32';ctx.fillRect(4,41,9,17);ctx.fillRect(21,41,9,17);ctx.fillStyle='#9b2e25';ctx.fillRect(2,11,30,8);ctx.restore()}
function loop(){requestAnimationFrame(loop);if(running){world+=speed;spawn-=speed;if(spawn<0){add();spawn=150+Math.random()*150}p.vy+=.6;p.y+=p.vy;if(p.y>=H*.72){p.y=H*.72;p.vy=0;p.ground=true}for(let i=obs.length-1;i>=0;i--){let o=obs[i],x=o.x-world;if(o.t===1&&Math.abs(x-(p.x+15))<25&&Math.abs(o.y-p.y)<55){coins++;obs.splice(i,1)}else if(o.t===0&&x<p.x+35&&x+o.w>p.x&&p.y+50>o.y-o.h){hp--;obs.splice(i,1);if(hp<=0){running=false;document.getElementById('intro').style.display='grid';document.querySelector('.sub').textContent='RUN OVER';document.querySelector('.panel p').textContent='Coins: '+coins+' · Distance: '+Math.floor(world/10)+'m';document.getElementById('start').textContent='RUN AGAIN'}}}speed=Math.min(9,4+world/5000);document.getElementById('coins').textContent=coins;document.getElementById('hp').textContent=hp;document.getElementById('distance').textContent=Math.floor(world/10)}draw()}loop();
</script></body></html>
