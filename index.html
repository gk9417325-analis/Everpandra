<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>EVERPENDRA — Mission 01</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10140f;font-family:Arial;color:white}canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:3;font-weight:800}.pill{background:#07100ddd;padding:9px 12px;border-radius:14px;border:1px solid #ffffff30}
#mission{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#07100dcc;padding:8px 13px;border-radius:12px;font-size:12px;text-align:center;z-index:3}
#intro,#win{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#38503ddd,#070a07f2);z-index:10}.panel{text-align:center;width:min(92vw,500px);padding:25px}.logo{font-size:clamp(46px,12vw,78px);margin:0;color:#e7bd62;letter-spacing:-.07em}.gold{color:#e7bd62;font-weight:800}.btn{border:0;border-radius:999px;padding:14px 23px;background:#e7bd62;color:#17130c;font-weight:900;font-size:15px}
#controls{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 15px;z-index:5;pointer-events:none}.group{display:flex;gap:9px}.ctrl{pointer-events:auto;width:58px;height:58px;border-radius:50%;border:1px solid #fff4;background:#07100dcc;color:white;font-size:21px}.red{background:#8e2929cc}
#tip{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);font-size:11px;color:#fff9;white-space:nowrap;z-index:4}
</style></head><body>
<canvas id="g"></canvas>
<div id="hud"><div class="pill">❤️ <span id="hp">3</span></div><div class="pill">💰 <span id="loot">0</span>/3</div></div>
<div id="mission">MISSION 01 · <span id="objective">Reach the Haveli</span></div>
<div id="intro"><div class="panel"><div class="gold">EVERPENDRA</div><h1 class="logo">RAAT KA RAAZ</h1><p>Enter the old Indian haveli, collect the three hidden relics and escape without being caught.</p><button class="btn" id="start">START MISSION</button></div></div>
<div id="win" style="display:none"><div class="panel"><div class="gold">MISSION COMPLETE</div><h1>RAAT KA RAAZ</h1><p id="result"></p><button class="btn" id="again">PLAY AGAIN</button></div></div>
<div id="tip">Move ◀ ▶ · hide in blue shadows · distract with 🪙 · ⚔ only if necessary</div>
<div id="controls"><div class="group"><button class="ctrl" id="l">◀</button><button class="ctrl" id="r">▶</button></div><div class="group"><button class="ctrl" id="coin">🪙</button><button class="ctrl red" id="hit">⚔</button></div></div>
<script>
const c=document.getElementById('g'),x=c.getContext('2d');let W,H,D;function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();
let run=false,px,py,hp,loot,cam=0,guards=[],relics=[],keys={},noise=0,inv=0;
const worldW=2600;
function reset(){px=180;py=H*.55;hp=3;loot=0;cam=0;noise=0;inv=0;guards=[{x:700,y:H*.43,d:1,alert:0},{x:1250,y:H*.62,d:-1,alert:0},{x:1850,y:H*.40,d:1}];relics=[{x:620,y:H*.54},{x:1430,y:H*.30},{x:2050,y:H*.60}]}
function start(){reset();run=true;intro.style.display='none';win.style.display='none'}startBtn.onclick=start;again.onclick=start;
function move(v){if(run){px+=v;px=Math.max(50,Math.min(worldW-80,px))}}
l.onpointerdown=()=>keys.l=1;l.onpointerup=()=>keys.l=0;r.onpointerdown=()=>keys.r=1;r.onpointerup=()=>keys.r=0;
coin.onpointerdown=()=>{if(run)noise=35};hit.onpointerdown=()=>{if(run)inv=12};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.l=1;if(e.key==='ArrowRight')keys.r=1;if(e.key===' ')noise=35;if(e.key==='x')inv=12});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=0;if(e.key==='ArrowRight')keys.r=0});
function box(a,b){return Math.abs(a.x-b.x)<34&&Math.abs(a.y-b.y)<42}
function draw(){
let grd=x.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#172e31');grd.addColorStop(1,'#d18b52');x.fillStyle=grd;x.fillRect(0,0,W,H);
let ox=-cam;
x.fillStyle='#25311f';x.fillRect(ox,0,worldW,H);
for(let i=0;i<8;i++){let bx=i*350+100+ox;x.fillStyle='#172419';x.fillRect(bx,H*.22,120,H*.5);x.fillStyle='#8b573b';x.fillRect(bx+18,H*.29,84,H*.36);x.fillStyle='#c9975a';x.fillRect(bx+42,H*.29,36,20)}
// path
x.fillStyle='#a77b4d';x.fillRect(ox,H*.55,worldW,H*.25);
for(let i=0;i<18;i++){let bx=i*150+80+ox;x.fillStyle='#34522f';x.beginPath();x.arc(bx,H*.45,55,0,Math.PI*2);x.fill();x.fillStyle='#50321e';x.fillRect(bx-7,H*.43,14,120)}
// hide zones
for(let i=0;i<5;i++){let bx=420+i*470+ox;x.fillStyle='#214c57aa';x.fillRect(bx,H*.45,90,105);x.fillStyle='#9ed6dd';x.font='12px Arial';x.fillText('HIDE',bx+27,H*.51)}
// exit
x.fillStyle='#e5bd65';x.fillRect(worldW-110+ox,H*.43,60,120);x.fillStyle='#281b12';x.fillRect(worldW-95+ox,H*.50,30,70);x.fillStyle='#fff';x.font='12px Arial';x.fillText('EXIT',worldW-100+ox,H*.40);
// relics
relics.forEach((q,i)=>{if(!q.taken){let bx=q.x+ox;x.fillStyle='#e7bd62';x.beginPath();x.arc(bx,q.y,12,0,Math.PI*2);x.fill();x.fillStyle='#fff3b0';x.font='18px serif';x.fillText('◆',bx-7,q.y+7)}});
// guards vision
guards.forEach(g=>{let bx=g.x+ox;x.fillStyle=g.alert>0?'#ff5b4555':'#ffd85c25';x.beginPath();x.moveTo(bx,g.y);x.lineTo(bx+g.d*180,g.y-80);x.lineTo(bx+g.d*180,g.y+80);x.closePath();x.fill();x.fillStyle='#542a25';x.beginPath();x.arc(bx,g.y-25,14,0,Math.PI*2);x.fill();x.fillStyle='#6f4030';x.fillRect(bx-15,g.y-12,30,42);x.fillStyle='#d9a45d';x.fillRect(bx-25,g.y+28,50,8)});
// player
let sx=px+ox;x.fillStyle='#0006';x.beginPath();x.ellipse(sx,py+47,24,6,0,0,Math.PI*2);x.fill();x.fillStyle='#eee2c7';x.fillRect(sx-16,py-5,32,38);x.fillStyle='#a82e29';x.fillRect(sx-18,py+15,36,8);x.fillStyle='#204c78';x.fillRect(sx-18,py-9,36,8);x.fillStyle='#c9854d';x.beginPath();x.arc(sx,py-20,14,0,Math.PI*2);x.fill();x.fillStyle='#241a16';x.beginPath();x.arc(sx,py-26,14,Math.PI,Math.PI*2);x.fill();x.fillStyle='#b72f2d';x.fillRect(sx-13,py-22,26,4);
}
function logic(){
if(!run)return;
if(keys.l)px-=3.2;if(keys.r)px+=3.2;px=Math.max(40,Math.min(worldW-70,px));cam=Math.max(0,Math.min(worldW-W,px-W*.28));
if(noise>0)noise--;
guards.forEach(g=>{g.x+=g.d*1.1;if(g.x<g.d?400:450||g.x>g.x){};if(g.x<400)g.d=1;if(g.x>worldW-300)g.d=-1;let dist=Math.abs(g.x-px);let facing=(g.d>0&&px>g.x)||(g.d<0&&px<g.x);if(dist<170&&facing&&Math.abs(g.y-py)<75&&!noise)g.alert=12;if(noise&&dist<260)g.alert=0;if(g.alert>0)g.alert--;if(g.alert===10&&dist<85&&!inv){hp--;document.getElementById('hp').textContent=hp;px-=g.d*60;if(hp<=0){run=false;intro.style.display='grid';document.querySelector('#intro p').textContent='You were caught. Try using the blue hiding zones and distractions.';startBtn.textContent='TRY AGAIN'}}});
relics.forEach(q=>{if(!q.taken&&Math.abs(q.x-px)<38&&Math.abs(q.y-py)<55){q.taken=true;loot++;document.getElementById('loot').textContent=loot}});
if(loot===3&&px>worldW-180){run=false;win.style.display='grid';result.textContent='You stole all 3 relics and escaped the haveli. Health left: '+hp+' / 3. This is only the first mission.'}
document.getElementById('objective').textContent=loot<3?'Find the relics · '+loot+'/3':'Escape the haveli!';
}
function loop(){requestAnimationFrame(loop);logic();draw()}loop();
</script>
</body></html>
